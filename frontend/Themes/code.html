<style>
        /* Modern Brutalism & High-Energy Physics Aesthetic */
        body {
            overflow: hidden;
        }

        /* Energy Leak Glows */
        .energy-leak {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .energy-leak:hover {
            /* 10px directional outer glow on Y axis for "escaping light" */
            box-shadow: 0 10px 30px -5px rgba(255, 191, 0, 0.3), 0 -10px 30px -5px rgba(255, 191, 0, 0.1);
        }

        /* Input Base Glow */
        .input-chamber {
            transition: border-color 0.2s, box-shadow 0.2s, color 0.3s, background-color 0.3s;
        }
        .input-chamber:focus {
            outline: none;
            border-bottom-width: 2px;
            border-bottom-color: #ffbf00; /* primary-container */
            box-shadow: 0 15px 25px -15px rgba(255, 191, 0, 0.3);
        }

        /* Technical Grid Overlay */
        .tech-grid {
            background-image: 
                linear-gradient(to right, rgba(229, 226, 218, 0.5) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(229, 226, 218, 0.5) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        @media (prefers-color-scheme: dark) {
            .tech-grid {
                background-image: 
                    linear-gradient(to right, rgba(53, 53, 53, 0.5) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(53, 53, 53, 0.5) 1px, transparent 1px);
            }
            .crosshair::before, .crosshair::after {
                background-color: #353535 !important;
            }
        }

        /* Corner Crosshairs */
        .crosshair::before, .crosshair::after {
            content: '';
            position: absolute;
            background-color: #cec6b4; /* outline-variant */
            transition: background-color 0.3s;
        }
        .crosshair-tl::before { top: -5px; left: 0; width: 1px; height: 10px; }
        .crosshair-tl::after { top: 0; left: -5px; width: 10px; height: 1px; }

        .crosshair-br::before { bottom: -5px; right: 0; width: 1px; height: 10px; }
        .crosshair-br::after { bottom: 0; right: -5px; width: 10px; height: 1px; }

        /* Status Notch */
        .status-notch {
            clip-path: polygon(100% 0, 0 0, 100% 100%);
        }

        /* Shimmer Effect for Data Overlays */
        @keyframes subtle-shimmer {
            0% { opacity: 0.5; }
            50% { opacity: 0.8; }
            100% { opacity: 0.5; }
        }
        .animate-data-shimmer {
            animation: subtle-shimmer 4s infinite ease-in-out;
        }
    </style>
