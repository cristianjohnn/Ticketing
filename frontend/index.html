<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="IT Support Ticketing System - Submit and manage support tickets efficiently">
    <title>IT Support Ticketing System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>
    <!-- ==================== SPLASH SCREEN (INITIALIZATION) ==================== -->
    <div id="splash-screen" class="active">
        <div class="splash-container glass-card">
            <div class="splash-shield-wrapper">
                <div class="splash-ripple"></div>
                <div class="splash-ripple delay-1"></div>
                <div class="splash-ripple delay-2"></div>
                <div class="splash-shield">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
            </div>
            <h2 class="splash-title">Loading IT Support Portal...</h2>
            <p class="splash-subtitle">Synchronizing ticket database, remote assets, and user profiles...</p>
        </div>
    </div>

    <!-- Layout mount points -->
    <div id="login-screen" class="screen"></div>
    <div id="client-screen" class="screen"></div>
    <div id="admin-screen" class="screen"></div>
    <div id="support-screen" class="screen"></div>

    <!-- Modals mount point -->
    <div id="modal-root"></div>

    <!-- Toast notification -->
    <div class="toast-container" id="toast-container"></div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
