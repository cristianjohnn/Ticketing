services:
  backend:
    build: ./backend
    container_name: ticketing-backend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/tickets.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-@inspireSupport}
    volumes:
      - db_data:/app/data
      - uploads_data:/app/uploads
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: ticketing-frontend
    expose:
      - "80"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ticketing-nginx
    ports:
      - "${APP_PORT:-3002}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ticketing-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    restart: always

volumes:
  db_data:
  uploads_data:
  redis_data:
